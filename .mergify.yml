pull_request_rules:
  - name: BB copy provenance source
    conditions:
      - title = BB copy collision source
    actions:
      copy:
        branches:
          - release-bb
        title: "BB copy collision (copy #{{ number }})"

  - name: BB trusted bot copy auto merge
    conditions:
      - author = mergify[bot]
      - base = release-bb
      - head ~= ^mergify/copy/release-bb/pr-
    actions:
      merge:
        method: merge

  - name: BB deleted-fork copy source provenance
    conditions:
      - closed
      - title = BB deleted fork copy collision source
    actions:
      copy:
        branches:
          - release-bb
        title: "BB deleted fork copy collision (copy #{{ number }})"

  - name: BB one-shot deleted-fork protected release cleanup
    conditions:
      - base = release-bb
      - title = BB deleted-fork protected release cleanup Q7N4
    actions:
      merge:
        method: merge
