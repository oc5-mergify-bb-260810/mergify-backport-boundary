pull_request_rules:
  - name: BB copy provenance source
    conditions:
      - title = BB copy collision source
    actions:
      copy:
        branches:
          - release-bb
        title: "BB copy collision (copy #{{ number }})"

  - name: BB trusted bot copy auto merge
    conditions:
      - author = mergify[bot]
      - base = release-bb
      - head ~= ^mergify/copy/release-bb/pr-
    actions:
      merge:
        method: merge

  - name: BB deleted-fork backport source provenance
    conditions:
      - merged
      - title = BB deleted fork backport collision source
    actions:
      backport:
        branches:
          - release-bb
        title: "BB deleted fork backport collision (backport #{{ number }})"

  - name: BB trusted bot backport auto merge
    conditions:
      - author = mergify[bot]
      - base = release-bb
      - head ~= ^mergify/bp/release-bb/pr-
    actions:
      merge:
        method: merge
