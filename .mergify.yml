pull_request_rules:
  - name: BB copy provenance source
    conditions:
      - title = BB copy collision source
    actions:
      copy:
        branches:
          - release-bb
        title: "BB copy collision (copy #{{ number }})"

  - name: BB fork backport provenance source
    conditions:
      - title = BB backport fork collision source
    actions:
      backport:
        branches:
          - release-bb
        title: "BB backport fork collision (backport #{{ number }})"

  - name: BB trusted bot copy auto merge
    conditions:
      - author = mergify[bot]
      - base = release-bb
      - head ~= ^mergify/copy/release-bb/pr-
    actions:
      merge:
        method: merge
