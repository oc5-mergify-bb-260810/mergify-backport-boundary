pull_request_rules:
  - name: BB copy provenance source
    conditions:
      - title = BB copy collision source
    actions:
      copy:
        branches:
          - release-bb
        title: "BB copy collision (copy #{{ number }})"

  - name: BB trusted bot copy auto merge
    conditions:
      - author = mergify[bot]
      - base = release-bb
      - head ~= ^mergify/copy/release-bb/pr-
    actions:
      merge:
        method: merge

  - name: BB migration preseed trigger
    conditions:
      - merged
      - title = BB migration preseed never match
    actions:
      delete_head_branch:
        force: false
