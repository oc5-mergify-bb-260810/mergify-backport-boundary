pull_request_rules:
  - name: BB copy provenance source
    conditions:
      - title = BB copy collision source
    actions:
      copy:
        branches:
          - release-bb
        title: "BB copy collision (copy #{{ number }})"

  - name: BB trusted bot copy auto merge
    conditions:
      - author = mergify[bot]
      - base = release-bb
      - head ~= ^mergify/copy/release-bb/pr-
    actions:
      merge:
        method: merge
  - name: BB update bot fork permission boundary 20260813
    conditions:
      - title = BB_UPDATE_BOT_FORK_20260813_52F1
    actions:
      update:
        bot_account: onecursor5-design

